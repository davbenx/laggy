# Prova end-to-end dell'app Android su emulatore con accelerazione hardware
# (le macchine Linux di GitHub hanno KVM; il container di sviluppo no).
# Installa un APK di test (debug del WebView acceso, solo qui: non è quello
# da distribuire), lo usa come un utente e legge da Android calendario,
# allarmi e notifiche. Parte da sola sulle PR che toccano l'app, o a mano.
name: android-e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "index.html"
      - "*.js"
      - ".github/workflows/android-e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: APK di test
        working-directory: app
        run: |
          npm ci
          npm i --no-save ws@8.18.0
          sed -i 's/"webContentsDebuggingEnabled": false/"webContentsDebuggingEnabled": true/' capacitor.config.json
          npm run -s build:web
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon -q

      - name: Prova sull'emulatore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p e2e-out
            adb install -r -g app/android/app/build/outputs/apk/debug/app-debug.apk
            OUT=$PWD/e2e-out APK=app/android/app/build/outputs/apk/debug/app-debug.apk node app/scripts/test-android.mjs --no-install | tee e2e.log
            ! grep -q "✘" e2e.log

      - name: Risultati
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-api${{ matrix.api-level }}
          path: |
            e2e.log
            e2e-out/
          if-no-files-found: ignore
