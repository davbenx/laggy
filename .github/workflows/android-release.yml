# App bundle (.aab) firmato per il Play Store.
# Si lancia a mano: GitHub → Actions → "Android release" → Run workflow.
# Il file da caricare sulla Play Console è nell'artefatto "notturnisti-aab".
#
# Secrets del repository (Settings → Secrets and variables → Actions), da
# impostare una volta. La chiave di UPLOAD non lascia mai GitHub e non entra
# nel repository; con Play App Signing la chiave di firma vera la tiene Google.
#   ANDROID_UPLOAD_KEYSTORE_B64   il file upload.jks in base64 (base64 -w0 upload.jks)
#   ANDROID_UPLOAD_STORE_PASSWORD password del keystore
#   ANDROID_UPLOAD_KEY_ALIAS      alias della chiave (es. upload)
#   ANDROID_UPLOAD_KEY_PASSWORD   password della chiave
name: Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versione visibile agli utenti (es. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: android-actions/setup-android@v3

      - name: Prove prima di compilare
        run: node --test tests/*.test.js

      - name: File web e plugin nativi
        working-directory: app
        run: |
          npm ci
          npm run build:web
          npx cap sync android

      - name: Chiave di upload (dai secrets)
        working-directory: app/android
        env:
          KS_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Mancano i secrets della chiave di upload (vedi l'intestazione di questo file)."; exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties

      - name: App bundle firmato
        working-directory: app/android
        run: |
          # versionCode = numero dell'esecuzione: cresce sempre, come vuole il Play Store.
          ./gradlew bundleRelease --no-daemon \
            -PntVersionCode=${{ github.run_number }} \
            -PntVersionName=${{ inputs.version_name }}
          rm -f keystore.properties "$RUNNER_TEMP/upload.jks"

      - name: Controllo firma e identificativo
        working-directory: app/android
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | grep -q "jar verified"
          unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -q "club.notturnisti.app"

      - uses: actions/upload-artifact@v4
        with:
          name: notturnisti-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
